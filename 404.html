<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Redirecting...</title>
<link rel="canonical" href="https://pdf2dxf.us/">
<meta http-equiv="refresh" content="0; url=https://pdf2dxf.us/">
<script>
  // Redirect www to non-www, preserve path
  var url = window.location.href;
  url = url.replace('www.pdf2dxf.us', 'pdf2dxf.us');
  url = url.replace('http://', 'https://');
  window.location.replace(url);
</script>
</head>
<body>
<p>Redirecting to <a href="https://pdf2dxf.us/">pdf2dxf.us</a>...</p>
</body>
</html>
